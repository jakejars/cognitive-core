name: Protocol Tests

on:
  push:
    branches:
      - main
      - fix/protocol-hardening-final
  pull_request:

jobs:
  protocol:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Compile protocol and runner modules
        run: |
          python -m compileall -q contract harness
      - name: Run protocol tests
        run: |
          python -m pytest -q contract/tests harness/tests
